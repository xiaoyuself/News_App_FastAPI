<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>新闻软件</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- 顶部导航栏 -->
    <header id="app-header">
      <button id="header-back" class="header-btn hidden" title="返回">‹</button>
      <h1 id="header-title">新闻</h1>
      <div id="header-right"></div>
    </header>

    <!-- 主内容区（由路由渲染） -->
    <main id="app-main"></main>

    <!-- 底部三个分区：新闻 / AI对话 / 个人中心 -->
    <nav id="tab-bar">
      <div class="tab-item active" data-tab="news">
        <span class="tab-icon">📰</span>
        <span class="tab-label">新闻</span>
      </div>
      <div class="tab-item" data-tab="ai">
        <span class="tab-icon">🤖</span>
        <span class="tab-label">AI对话</span>
      </div>
      <div class="tab-item" data-tab="profile">
        <span class="tab-icon">👤</span>
        <span class="tab-label">个人中心</span>
      </div>
    </nav>
  </div>

  <!-- 轻提示 -->
  <div id="toast" class="toast hidden"></div>

  <!-- 脚本按依赖顺序加载 -->
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/views/news.js"></script>
  <script src="js/views/detail.js"></script>
  <script src="js/views/chat.js"></script>
  <script src="js/views/profile.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
