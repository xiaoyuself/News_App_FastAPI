services:
  mysql:
    image: mysql:8.0
    container_name: news-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Li123456789
      MYSQL_DATABASE: news_app
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      # 2G 小机器省内存：缓冲池降到 64M，关掉 performance_schema、表空间自动扩展检查
      - --innodb-buffer-pool-size=64M
      - --performance-schema=off
      - --max-connections=100
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7.2-alpine
    container_name: news-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - Li123456789
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a Li123456789 ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: "./news_check_system(back)"
    image: news-backend:v1
    container_name: news-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "mysql+aiomysql://root:Li123456789@mysql:3306/news_app?charset=utf8mb4"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: Li123456789
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      # 用 python 自带的 urllib 探活（slim 镜像里没有 curl）
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/',timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  ai:
    build: "./news_check_system(AI)"
    image: news-ai:v1
    container_name: news-ai
    restart: unless-stopped
    env_file:
      - ./news_check_system(AI)/.env
    environment:
      MILVUS_MODE: lite
      # lite 模式的本地 .db 路径。⚠️ 变量名不能叫 MILVUS_URI：
      # pymilvus 3.x 在 import 时就读取 MILVUS_URI 并校验成 http(s):// 形式，传文件路径会直接报错
      MILVUS_LITE_PATH: /app/milvus_data/milvus.db
      LANGSMITH_TRACING: "false"
      TZ: Asia/Shanghai
    volumes:
      # 知识库目录挂载到宿主机：改完文件重建索引即可，不用重建镜像
      - ./news_check_system(AI)/data:/app/data
      # milvus-lite 的向量数据文件（.db），持久化保存
      - milvus_lite_data:/app/milvus_data
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/',timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      # 首次启动要在后台下载/加载向量库并建索引，给足 90 秒
      start_period: 90s

  web:
    build: "./news_check_system(front)"
    image: news-web:v1
    container_name: news-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  milvus_lite_data: